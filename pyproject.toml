[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llmserve"
version = "0.1.0"
description = "A from-scratch LLM inference and serving engine: paged KV cache, continuous batching, prefix caching, speculative decoding, quantization, OpenAI-compatible API."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Buland Choudhary" }]
dependencies = [
    "torch>=2.8",
    "numpy>=2.0",
    "safetensors>=0.5",
    "huggingface_hub>=0.34",
    "tokenizers>=0.21",
    "transformers>=4.56",
    "jinja2>=3.1",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "prometheus-client>=0.21",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "matplotlib>=3.9",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.12", "openai>=1.60"]

[project.scripts]
llmserve = "llmserve.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/llmserve"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs downloaded model weights (skipped in CI)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
